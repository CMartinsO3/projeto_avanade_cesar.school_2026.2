spring.application.name=petcheckin

# ===== Banco de dados =====
spring.datasource.url=jdbc:postgresql://localhost:5433/petcheckin
spring.datasource.username=${DB_USER:petcheckin}
spring.datasource.password=${DB_PASSWORD:petcheckin}

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
