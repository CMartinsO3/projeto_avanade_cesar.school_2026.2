spring.application.name=petcheckin

# ===== Banco de dados =====
spring.datasource.url=jdbc:postgresql://localhost:5433/petcheckin
spring.datasource.username=${DB_USER:petcheckin}
spring.datasource.password=${DB_PASSWORD:petcheckin}

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===== Upload de documentos =====
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.pasta=uploads


# ===== OCR (Tesseract) =====
app.ocr.comando=tesseract
app.ocr.idioma=por
app.ocr.timeout-segundos=60